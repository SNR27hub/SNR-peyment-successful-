<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful</title>
<style>
  :root{
    --deep:#0b3d2e;
    --mint:#1fae7a;
    --mint-light:#4fd8a5;
    --gold:#f2c14e;
    --paper:#f7fbf9;
    --ink:#0b2b22;
    --muted:#5c7a70;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:"Segoe UI", "Noto Sans Devanagari", "Noto Sans", sans-serif;
    background:radial-gradient(circle at 50% -10%, var(--mint-light) 0%, var(--deep) 55%, #062318 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    color:var(--ink);
  }

  #confetti-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
  }

  .frame{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    width:min(420px, 92vw);
    height:min(700px, 92vh);
    padding:28px 24px;
  }

  .top-tag{
    color:rgba(255,255,255,0.85);
    font-size:14px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    font-weight:600;
    text-shadow:0 1px 4px rgba(0,0,0,0.25);
  }

  .card{
    background:var(--paper);
    border-radius:24px;
    padding:40px 30px 34px;
    width:100%;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06) inset;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    animation:cardIn 700ms cubic-bezier(.2,.9,.25,1) both;
    animation-delay:150ms;
  }

  @keyframes cardIn{
    from{opacity:0; transform:translateY(26px) scale(.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .check-wrap{
    position:relative;
    width:110px;
    height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
  }

  /* continuous outward ripple rings once verification completes */
  .check-wrap::before,
  .check-wrap::after{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:50%;
    border:2px solid var(--mint);
    opacity:0;
    animation:ripple 2.2s ease-out infinite;
    animation-delay:2200ms;
  }
  .check-wrap::after{ animation-delay:2950ms; }

  @keyframes ripple{
    0%{ transform:scale(0.85); opacity:0.55; }
    100%{ transform:scale(1.55); opacity:0; }
  }

  .ring{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform:rotate(-90deg);
  }
  .ring circle{
    fill:none;
    stroke:var(--mint-light);
    stroke-width:4;
    stroke-linecap:round;
    stroke-dasharray:296;
    stroke-dashoffset:296;
    animation:verify 950ms cubic-bezier(.4,0,.2,1) 150ms forwards;
  }

  @keyframes verify{ to{ stroke-dashoffset:0; } }

  .check-circle{
    width:96px;
    height:96px;
    border-radius:50%;
    background:linear-gradient(160deg, var(--mint-light), var(--mint));
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 10px rgba(31,174,122,0.12), 0 12px 24px -8px rgba(31,174,122,0.55);
    animation:
      pop 650ms cubic-bezier(.2,.9,.25,1) 1100ms both,
      glow 2.4s ease-in-out infinite 1900ms;
  }

  @keyframes pop{
    0%{transform:scale(0);}
    65%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }

  @keyframes glow{
    0%,100%{ box-shadow:0 0 0 10px rgba(31,174,122,0.12), 0 12px 24px -8px rgba(31,174,122,0.55); }
    50%{ box-shadow:0 0 0 16px rgba(31,174,122,0.05), 0 16px 32px -6px rgba(31,174,122,0.75); }
  }

  .checkmark{ width:48px; height:48px; }
  .checkmark path{
    fill:none;
    stroke:#ffffff;
    stroke-width:5;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:48;
    stroke-dashoffset:48;
    animation:draw 550ms ease-out 1550ms forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .status{
    font-size:23px;
    font-weight:800;
    color:var(--deep);
    margin:0 0 6px;
    letter-spacing:.2px;
  }

  .sub{
    font-size:14.5px;
    color:var(--muted);
    margin:0 0 26px;
    line-height:1.5;
  }

  .amount{
    font-size:34px;
    font-weight:800;
    color:var(--ink);
    letter-spacing:.3px;
    margin-bottom:4px;
  }

  .amount small{
    font-size:16px;
    font-weight:600;
    color:var(--muted);
    margin-right:2px;
  }

  .divider{
    width:100%;
    height:1px;
    background:repeating-linear-gradient(90deg, #d9e6e0 0 8px, transparent 8px 16px);
    margin:22px 0 20px;
  }

  .meta{
    width:100%;
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .meta span:last-child{ color:var(--ink); font-weight:600; }

  .go-back{
    margin-top:28px;
    width:100%;
    padding:14px 0;
    border:none;
    border-radius:14px;
    background:linear-gradient(160deg, var(--mint-light), var(--mint));
    color:#fff;
    font-size:15.5px;
    font-weight:700;
    letter-spacing:.3px;
    cursor:pointer;
    box-shadow:0 10px 22px -8px rgba(31,174,122,0.6);
    transition:transform 150ms ease, box-shadow 150ms ease;
  }
  .go-back:hover{ transform:translateY(-1px); box-shadow:0 14px 26px -8px rgba(31,174,122,0.7); }
  .go-back:active{ transform:translateY(0); }
  .go-back:focus-visible{ outline:3px solid var(--gold); outline-offset:3px; }

  .footer-tag{
    color:rgba(255,255,255,0.8);
    font-size:13px;
    font-weight:500;
    text-shadow:0 1px 4px rgba(0,0,0,0.25);
    display:flex;
    align-items:center;
    gap:5px;
  }

  .heart{
    color:#ff5c7a;
    display:inline-block;
    animation:beat 1.2s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{ transform:scale(1); }
    25%{ transform:scale(1.25); }
    40%{ transform:scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .check-wrap, .checkmark path, .heart{ animation:none !important; }
    .checkmark path{ stroke-dashoffset:0; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="frame">
  <div class="top-tag">Love from SNR</div>

  <div class="card">
    <div class="check-wrap">
      <svg class="ring" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r="47"/>
      </svg>
      <div class="check-circle">
        <svg class="checkmark" viewBox="0 0 24 24">
          <path d="M4 12.5L9.5 18L20 6"/>
        </svg>
      </div>
    </div>

    <p class="status">Payment Successful</p>
    <p class="sub">Your transaction has been completed securely.</p>

    <button class="go-back" id="goBackBtn">Go Back</button>
  </div>

  <div class="footer-tag">Made With <span class="heart">❤️</span> By SNR</div>
</div>

<script>
  // Go back to whichever site the user came from
  document.getElementById('goBackBtn').addEventListener('click', function () {
    if (document.referrer) {
      window.location.href = document.referrer;
    } else if (window.history.length > 1) {
      window.history.back();
    } else {
      window.close();
    }
  });

  // Confetti celebration burst — erupts from the success badge, slow-motion feel
  (function () {
    var canvas = document.getElementById('confetti-canvas');
    var ctx = canvas.getContext('2d');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    if (reduceMotion) return;

    var colors = ['#4fd8a5', '#1fae7a', '#f2c14e', '#ffffff', '#ff9f68'];
    var pieces = [];
    var count = 130;
    var SLOW = 0.45; // slow-motion multiplier for that drifting, cinematic feel

    function originPoint() {
      var el = document.querySelector('.check-wrap');
      var rect = el.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
    }

    function spawn() {
      var origin = originPoint();
      pieces = [];
      for (var i = 0; i < count; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = 2.5 + Math.random() * 5.5;
        pieces.push({
          x: origin.x,
          y: origin.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3.2,
          size: 5 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          vrot: (Math.random() - 0.5) * 7,
          gravity: 0.09 + Math.random() * 0.06,
          drag: 0.988,
          life: 0,
          maxLife: 190 + Math.random() * 90
        });
      }
    }

    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var alive = false;
      for (var i = 0; i < pieces.length; i++) {
        var p = pieces[i];
        if (p.life > p.maxLife) continue;
        alive = true;
        p.vx *= p.drag;
        p.vy = p.vy * p.drag + p.gravity * SLOW;
        p.x += p.vx * SLOW;
        p.y += p.vy * SLOW;
        p.rot += p.vrot * SLOW;
        p.life++;

        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.5);
        ctx.restore();
      }
      if (alive) requestAnimationFrame(frame);
    }

    // fires right as the checkmark finishes drawing, bursting from the badge itself
    setTimeout(function () {
      spawn();
      requestAnimationFrame(frame);
    }, 2100);
  })();
</script>

</body>
</html>
